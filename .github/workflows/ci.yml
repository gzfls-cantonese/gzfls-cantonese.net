name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for the GITHUB_TOKEN: nothing here writes back to the repo.
permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # Last on purpose: an advisory blocks the pipeline, and running it first
      # used to skip typecheck/test/build entirely, so a red run said nothing
      # about whether the code still worked.
      - name: Dependency security audit
        run: npm audit --audit-level=high

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/recordings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No install step: the function has zero npm dependencies, so `node --test`
      # runs straight off the checkout.
      - name: Unit tests
        run: npm test

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r tools/pipeline/requirements.txt

      - name: Unit tests
        run: pytest -q
        working-directory: tools/pipeline

      # Last on purpose, for the same reason as the web job: an advisory fails the
      # run, so putting it first would let it mask whether the pipeline still
      # works. Resolves the transitive tree, matching what `npm audit` covers.
      - name: Dependency security audit
        run: |
          pip install pip-audit
          pip-audit -r tools/pipeline/requirements.txt
